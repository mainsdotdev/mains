name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The desktop app lives in apps/desktop; every npm command runs there.
defaults:
  run:
    working-directory: apps/desktop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - run: npm test

  codex-app-server:
    name: Codex app-server (${{ matrix.codex-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codex-version: ["0.147.0", "0.153.4", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Install Codex CLI
        run: npm install --global @openai/codex@${{ matrix.codex-version }}
      - run: npm run codex:protocol:smoke

  # Feature work merges into dev; main only ever receives a preview promotion
  # (dev) or a fix branch (hotfix / preview defect). GitHub has no native way to
  # restrict which branches may target a base, so it is a status check.
  pr-target:
    name: PR target
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev and fix/* may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|fix/*)
              echo "$HEAD_REF -> main is allowed." ;;
            *)
              echo "::error::'$HEAD_REF' cannot target main. Feature work merges into dev; only dev (preview promotion) and fix/* (hotfix or preview defect) may target main."
              exit 1 ;;
          esac
