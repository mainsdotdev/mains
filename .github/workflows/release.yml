name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# The desktop app lives in apps/desktop; every npm command runs there.
defaults:
  run:
    working-directory: apps/desktop

jobs:
  release:
    name: Build & Publish (${{ matrix.arch }})
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Preview releases are cut from dev, stable releases from main. The tag's
      # prerelease suffix decides which branch has to contain it.
      - name: Resolve release channel
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-preview.* ]]; then
            echo "name=preview" >> "$GITHUB_OUTPUT"
            echo "base=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
          fi

      # actions/checkout only fetches the tag itself, so origin/<base> has to be
      # fetched explicitly before it can be used as an ancestry reference.
      - name: Ensure tag is from ${{ steps.channel.outputs.base }}
        env:
          BASE: ${{ steps.channel.outputs.base }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          git fetch origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BASE"; then
            echo "::error::$GITHUB_REF_NAME is a $CHANNEL tag but is not on $BASE. Release is blocked."
            exit 1
          fi

      # electron-forge's GitHub publisher names the release from package.json
      # (`v${version}`), not from the pushed tag. When the two disagree, CI
      # quietly creates a release for a version nobody tagged.
      - name: Ensure package.json matches the tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $VERSION but the tag is $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci

      # npm ci on the arm64 runner only installs the host-arch copilot binary
      # package (@github/copilot-darwin-arm64). The x64 build needs the x64
      # variant, so fetch its tarball and drop it into node_modules directly —
      # `npm install --cpu x64` would re-reify the whole tree against x64 and
      # could swap out build tooling (esbuild etc.) needed on the arm64 host.
      - name: Install x64 agent binary packages
        if: matrix.arch == 'x64'
        run: |
          # Read the file directly — @github/copilot's "exports" field blocks
          # require('@github/copilot/package.json') as a bare specifier.
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@github/copilot/package.json', 'utf8')).optionalDependencies['@github/copilot-darwin-x64']")
          npm pack "@github/copilot-darwin-x64@$VERSION"
          mkdir -p node_modules/@github/copilot-darwin-x64
          tar -xzf github-copilot-darwin-x64-*.tgz -C node_modules/@github/copilot-darwin-x64 --strip-components=1
          rm github-copilot-darwin-x64-*.tgz

          SDK_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@anthropic-ai/claude-agent-sdk/package.json', 'utf8')).optionalDependencies['@anthropic-ai/claude-agent-sdk-darwin-x64']")
          npm pack "@anthropic-ai/claude-agent-sdk-darwin-x64@$SDK_VERSION"
          mkdir -p node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64
          tar -xzf anthropic-ai-claude-agent-sdk-darwin-x64-*.tgz -C node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64 --strip-components=1
          rm anthropic-ai-claude-agent-sdk-darwin-x64-*.tgz

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

      - name: Publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional — when unset, osx-sign auto-discovers the imported cert.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the main bundle at build time by vite.main.config.mjs.
          # Unset, the GitHub sign-in button reports itself as unconfigured and
          # the personal-access-token tab still works.
          MAINS_GITHUB_CLIENT_ID: ${{ secrets.MAINS_GITHUB_CLIENT_ID }}
        run: npx electron-forge publish --platform darwin --arch ${{ matrix.arch }}

  standalone-server:
    name: Publish standalone server
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run package:server
      - run: npm run smoke:server-package

      - name: Upload standalone server assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-server/*.tgz --clobber
