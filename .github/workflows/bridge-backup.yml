name: Bridge daily backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to back up
        type: choice
        default: staging
        options: [staging, production, all]

permissions:
  contents: read

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.BRIDGE_BACKUPS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.environment == 'staging' && '["staging"]' || inputs.environment == 'production' && '["production"]' || '["staging","production"]') }}
    environment: bridge-backup-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: bridge-backup-${{ matrix.target }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/bridge
    env:
      TARGET_ENV: ${{ matrix.target }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/bridge/package-lock.json
      - run: npm ci
      - name: Verify CI token can read the configured D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/check-backup-access.ts
      - name: Prepare public encryption key (private key stays offline)
        env:
          BRIDGE_BACKUP_PUBLIC_KEY: ${{ vars.BRIDGE_BACKUP_PUBLIC_KEY }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            if (!process.env.BRIDGE_BACKUP_PUBLIC_KEY) throw new Error("Configure the backup environment public key first");
            writeFileSync(process.env.RUNNER_TEMP + "/bridge-backup-public.pem", process.env.BRIDGE_BACKUP_PUBLIC_KEY, {mode:0o600});
          '
      - name: Capture, verify, publish and retain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run backup -- run --environment "$TARGET_ENV" --public-key "$RUNNER_TEMP/bridge-backup-public.pem" --output "$RUNNER_TEMP/bridge-backup-$TARGET_ENV-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Remove sensitive runner files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/bridge-backup-$TARGET_ENV-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -f -- "$RUNNER_TEMP/bridge-backup-public.pem"
      # Never upload auth SQL, keys, manifests or backup bodies as CI artifacts.
