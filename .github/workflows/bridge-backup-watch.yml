name: Bridge backup freshness

on:
  schedule:
    - cron: '43 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.BRIDGE_BACKUPS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    environment: bridge-backup-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bridge-backup-${{ matrix.target }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/bridge
    env:
      TARGET_ENV: ${{ matrix.target }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/bridge/package-lock.json
      - run: npm ci
      - name: Prepare public key
        env:
          BRIDGE_BACKUP_PUBLIC_KEY: ${{ vars.BRIDGE_BACKUP_PUBLIC_KEY }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            if (!process.env.BRIDGE_BACKUP_PUBLIC_KEY) throw new Error("Configure the backup environment public key first");
            writeFileSync(process.env.RUNNER_TEMP + "/bridge-backup-public.pem", process.env.BRIDGE_BACKUP_PUBLIC_KEY, {mode:0o600});
          '
      - name: Fail if last completed backup is older than 36 hours
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run backup -- check --environment "$TARGET_ENV" --public-key "$RUNNER_TEMP/bridge-backup-public.pem"
      - name: Remove runner files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/bridge-backup-public.pem"
