<div id="mains-mosaic-new-shapes" lang="tr" role="group" aria-label="Yeni Mozaik şekilleri">
  <figure data-shape="arch">
    <canvas class="mosaic-large" role="img" aria-label="Kemer, altı açık, iki ayaklı bir yüz">Kemer</canvas>
    <figcaption>Kemer</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="kite">
    <canvas class="mosaic-large" role="img" aria-label="Uçurtma, hafif eğik baklava biçimli bir yüz">Uçurtma</canvas>
    <figcaption>Uçurtma</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="bubble">
    <canvas class="mosaic-large" role="img" aria-label="Baloncuk, tek yana kuyruk veren bir yüz">Baloncuk</canvas>
    <figcaption>Baloncuk</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="lantern">
    <canvas class="mosaic-large" role="img" aria-label="Fener, üstte delikli bir sapı olan bir yüz">Fener</canvas>
    <figcaption>Fener</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="swallow">
    <canvas class="mosaic-large" role="img" aria-label="Kırlangıç, yana açılan kanatları ve çatallı kuyruğu olan bir yüz">Kırlangıç</canvas>
    <figcaption>Kırlangıç</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="crescent">
    <canvas class="mosaic-large" role="img" aria-label="Hilal, yüzü sola toplanmış bir hilal">Hilal</canvas>
    <figcaption>Hilal</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
</div>
<style>
  #mains-mosaic-new-shapes {
    --mosaic-gap: calc(var(--font-size-base, 14px) / 2);
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: var(--mosaic-gap);
    padding-block: var(--mosaic-gap);
  }
  #mains-mosaic-new-shapes figure {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: var(--mosaic-gap);
    margin: 0;
    min-width: 0;
  }
  #mains-mosaic-new-shapes figcaption { font-weight: 500; }
  #mains-mosaic-new-shapes canvas { display: block; }
  #mains-mosaic-new-shapes .mosaic-large { width: 88px; height: 88px; }
  #mains-mosaic-new-shapes .mosaic-small { width: 24px; height: 24px; }
  @media (max-width: 585px) {
    #mains-mosaic-new-shapes {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      row-gap: calc(var(--mosaic-gap) * 2);
    }
  }
</style>
<script>
(() => {
  const root = document.getElementById("mains-mosaic-new-shapes");
  const darkScheme = matchMedia("(prefers-color-scheme: dark)");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const palette = {
    light: ["#e58b64", "#f5ae88", "#d77755", "#984934", "#3d251f"],
    dark: ["#e58c68", "#ffb68f", "#c97054", "#a64c35", "#351e18"],
  };
  const shapes = {
    arch: {
      outline: new Path2D("M13 85 V48 C13 25 29 10 50 10 C71 10 87 25 87 48 V85 Q87 89 83 89 H68 Q64 89 64 85 V72 Q64 68 60 68 H40 Q36 68 36 72 V85 Q36 89 32 89 H17 Q13 89 13 85 Z"),
      eyes: [35, 65, 51],
      tiles: [
        [12, 8, 38, 27, 1],
        [52, 8, 36, 27, 0],
        [12, 37, 36, 29, 0],
        [50, 37, 38, 29, 1],
        [12, 68, 27, 22, 2],
        [61, 68, 27, 22, 2],
      ],
    },
    kite: {
      outline: new Path2D("M56 7 Q59 5 62 10 L91 43 Q94 46 90 51 L47 93 Q43 97 39 92 L9 54 Q5 50 9 47 Z"),
      eyes: [36, 65, 49],
      tiles: [
        [10, 5, 81, 28, 1],
        [6, 35, 43, 28, 0],
        [51, 35, 43, 28, 1],
        [7, 65, 39, 31, 2],
        [48, 65, 45, 31, 0],
      ],
    },
    bubble: {
      outline: new Path2D("M27 17 H73 Q94 17 94 38 V50 Q94 72 73 72 H39 L19 89 Q15 92 17 86 L20 72 Q6 69 6 51 V39 Q6 17 27 17 Z"),
      eyes: [35, 65, 51],
      tiles: [
        [6, 16, 49, 19, 1],
        [57, 16, 38, 19, 2],
        [6, 37, 42, 33, 0],
        [50, 37, 45, 33, 1],
        [12, 72, 32, 20, 2],
      ],
    },
    lantern: {
      outline: new Path2D("M34 28 V17 Q34 7 44 7 H56 Q66 7 66 17 V28 H72 Q81 28 83 38 L88 70 H91 Q95 70 95 74 V86 Q95 88 93 88 H7 Q5 88 5 86 V74 Q5 70 9 70 H12 L17 38 Q19 28 28 28 Z M42 28 H58 V18 Q58 15 55 15 H45 Q42 15 42 18 Z"),
      eyes: [36, 64, 50],
      tiles: [
        [33, 6, 34, 22, 1],
        [12, 29, 37, 37, 0],
        [51, 29, 37, 37, 1],
        [4, 68, 27, 21, 2],
        [33, 68, 34, 21, 0],
        [69, 68, 27, 21, 2],
      ],
    },
    swallow: {
      outline: new Path2D("M7 19 Q3 17 5 23 L16 60 Q18 66 24 67 L36 66 L36 86 Q36 90 39 87 L50 76 L61 87 Q64 90 64 86 L64 66 L76 67 Q82 66 84 60 L95 23 Q97 17 93 19 L70 32 Q65 35 60 33 L51 29 Q50 28 49 29 L40 33 Q35 35 30 32 Z"),
      eyes: [37, 63, 50],
      tiles: [
        [4, 16, 23, 54, 2],
        [29, 27, 20, 39, 1],
        [51, 27, 20, 39, 0],
        [73, 16, 23, 54, 1],
        [33, 68, 16, 22, 0],
        [51, 68, 16, 22, 2],
      ],
    },
    crescent: {
      outline: new Path2D("M76 13 C55 1 29 8 15 30 C2 51 9 77 31 87 C52 97 77 87 89 70 C94 63 90 59 85 62 C76 67 63 68 54 60 C43 50 45 35 55 26 C62 20 70 19 76 19 C80 19 81 16 76 13 Z"),
      eyes: [24, 41, 52],
      tiles: [
        [8, 7, 44, 27, 1],
        [54, 7, 29, 27, 0],
        [7, 36, 24, 29, 0],
        [33, 36, 59, 29, 1],
        [8, 67, 32, 26, 2],
        [42, 67, 24, 26, 0],
        [68, 67, 24, 26, 1],
      ],
    },
  };
  const density = Math.max(2, Math.min(window.devicePixelRatio || 1, 3));
  const portraits = Array.from(root.querySelectorAll("figure"), figure => {
    const canvases = Array.from(figure.querySelectorAll("canvas"), canvas => {
      const size = canvas.classList.contains("mosaic-large") ? 88 : 24;
      canvas.width = canvas.height = Math.round(size * density);
      return { canvas, context: canvas.getContext("2d") };
    });
    return { shape: shapes[figure.dataset.shape], canvases };
  });

  function block(ctx, x, y, width, height, radius, fill) {
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, radius);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function paint({ shape, canvases }, dx = 0, dy = 0) {
    const theme = document.documentElement.dataset.theme || (darkScheme.matches ? "dark" : "light");
    const colors = palette[theme] ?? palette.light;
    for (const { canvas, context: ctx } of canvases) {
      if (!ctx) continue;
      const scale = canvas.width / 100;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, 100, 100);
      ctx.save();
      ctx.clip(shape.outline, "evenodd");
      for (const [x, y, width, height, tone] of shape.tiles) {
        block(ctx, x, y + 1.4, width, height, 3, colors[3]);
        block(ctx, x, y, width, height, 3, colors[tone]);
      }
      const [leftEye, rightEye, y] = shape.eyes;
      for (const x of [leftEye, rightEye]) {
        block(ctx, x - 4.5 + dx, y - 6.4 + dy, 9, 12.8, 2, colors[4]);
      }
      ctx.restore();
    }
  }

  function paintAll() {
    portraits.forEach(portrait => paint(portrait));
  }

  for (const portrait of portraits) {
    const { canvas } = portrait.canvases[0];
    canvas.addEventListener("pointermove", event => {
      if (event.pointerType === "touch" || reducedMotion.matches) return;
      const bounds = canvas.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      paint(portrait, x > 0.62 ? 2 : x < 0.38 ? -2 : 0, y > 0.62 ? 2 : y < 0.38 ? -2 : 0);
    });
    canvas.addEventListener("pointerleave", () => paint(portrait));
  }
  darkScheme.addEventListener("change", paintAll);
  reducedMotion.addEventListener("change", paintAll);
  window.addEventListener("openai:set_globals", paintAll);
  paintAll();
})();
</script>
