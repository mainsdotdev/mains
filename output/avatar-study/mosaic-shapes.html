<div id="mains-mosaic-shapes" lang="tr" role="group" aria-label="Mozaik avatar ailesi">
  <figure data-shape="steps">
    <canvas class="mosaic-large" role="img" aria-label="Basamak, farklı yükseklikte bloklardan oluşan yüz">Basamak</canvas>
    <figcaption>Basamak</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="sphere">
    <canvas class="mosaic-large" role="img" aria-label="Küre, yuvarlak dış hatlı blok yüz">Küre</canvas>
    <figcaption>Küre</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="cube">
    <canvas class="mosaic-large" role="img" aria-label="Blok, köşeli ve dolgun yüz">Blok</canvas>
    <figcaption>Blok</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="flower">
    <canvas class="mosaic-large" role="img" aria-label="Çiçek, dört yuvarlak yapraklı yüz">Çiçek</canvas>
    <figcaption>Çiçek</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="cross">
    <canvas class="mosaic-large" role="img" aria-label="Artı, dört yönde uzanan blok yüz">Artı</canvas>
    <figcaption>Artı</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
  <figure data-shape="weave">
    <canvas class="mosaic-large" role="img" aria-label="Örgü, kenarları iç içe geçen şeritlerden oluşan yüz">Örgü</canvas>
    <figcaption>Örgü</figcaption>
    <canvas class="mosaic-small" aria-hidden="true"></canvas>
  </figure>
</div>
<style>
  #mains-mosaic-shapes {
    --mosaic-gap: calc(var(--font-size-base, 14px) / 2);
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: var(--mosaic-gap);
    padding-block: var(--mosaic-gap);
  }
  #mains-mosaic-shapes figure {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: var(--mosaic-gap);
    margin: 0;
    min-width: 0;
  }
  #mains-mosaic-shapes figcaption { font-weight: 500; }
  #mains-mosaic-shapes canvas { display: block; }
  #mains-mosaic-shapes .mosaic-large { width: 88px; height: 88px; }
  #mains-mosaic-shapes .mosaic-small { width: 24px; height: 24px; }
  @media (max-width: 585px) {
    #mains-mosaic-shapes {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      row-gap: calc(var(--mosaic-gap) * 2);
    }
  }
</style>
<script>
(() => {
  const root = document.getElementById("mains-mosaic-shapes");
  const darkScheme = matchMedia("(prefers-color-scheme: dark)");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const palette = {
    light: ["#e58b64", "#f5ae88", "#d77755", "#984934", "#3d251f"],
    dark: ["#e58c68", "#ffb68f", "#c97054", "#a64c35", "#351e18"],
  };
  const sphereClip = new Path2D();
  sphereClip.ellipse(50, 50, 41, 40, 0, 0, 2 * Math.PI);
  const shapes = {
    steps: {
      eyes: [32, 61, 61],
      tiles: [
        [13, 28, 19, 21, [7, 3, 4, 5], 2],
        [34, 16, 29, 33, [8, 9, 4, 4], 1],
        [65, 22, 23, 27, [6, 9, 5, 4], 0],
        [13, 51, 29, 29, [5, 4, 4, 10], 0],
        [44, 51, 44, 29, [4, 5, 11, 4], 1],
        [25, 82, 17, 8, 3, 2],
        [44, 82, 21, 8, 3, 2],
        [67, 82, 12, 8, 3, 2],
      ],
    },
    sphere: {
      eyes: [36, 64, 53],
      clip: sphereClip,
      tiles: [
        [8, 8, 40, 23, 2, 1],
        [50, 8, 42, 23, 2, 0],
        [7, 33, 42, 35, 3, 0],
        [51, 33, 42, 35, 3, 1],
        [8, 70, 28, 23, 2, 2],
        [38, 70, 24, 23, 3, 0],
        [64, 70, 28, 23, 2, 2],
      ],
    },
    cube: {
      eyes: [33, 66, 55],
      tiles: [
        [12, 13, 33, 25, [9, 3, 3, 3], 1],
        [47, 13, 41, 25, [3, 9, 3, 3], 0],
        [12, 40, 37, 32, 4, 0],
        [51, 40, 37, 32, 4, 1],
        [12, 74, 24, 13, [3, 3, 3, 8], 2],
        [38, 74, 24, 13, 3, 2],
        [64, 74, 24, 13, [3, 3, 8, 3], 2],
      ],
    },
    flower: {
      eyes: [35, 65, 62],
      tiles: [
        [13, 10, 35, 38, [18, 17, 8, 10], 1],
        [52, 10, 35, 38, [17, 18, 10, 8], 0],
        [8, 50, 41, 37, [20, 7, 10, 19], 0],
        [51, 50, 41, 37, [7, 20, 19, 10], 1],
      ],
    },
    cross: {
      eyes: [38, 62, 50],
      tiles: [
        [36, 9, 28, 24, [5, 5, 3, 3], 1],
        [7, 35, 20, 30, [4, 3, 3, 4], 2],
        [29, 35, 20, 30, 3, 0],
        [51, 35, 20, 30, 3, 1],
        [73, 35, 20, 30, [3, 4, 4, 3], 0],
        [36, 67, 28, 23, [3, 3, 5, 5], 2],
      ],
    },
    weave: {
      eyes: [33, 65, 54],
      tiles: [
        [11, 12, 23, 23, [7, 6, 3, 3], 1],
        [66, 9, 23, 32, [6, 7, 3, 3], 0],
        [11, 37, 38, 29, 4, 0],
        [51, 43, 38, 26, 4, 1],
        [11, 68, 23, 22, [3, 3, 6, 7], 2],
        [66, 71, 23, 16, [3, 3, 7, 6], 2],
      ],
    },
  };
  const density = Math.max(2, Math.min(window.devicePixelRatio || 1, 3));
  const figures = Array.from(root.querySelectorAll("figure"), figure => {
    const canvases = Array.from(figure.querySelectorAll("canvas"), canvas => {
      const size = canvas.classList.contains("mosaic-large") ? 88 : 24;
      canvas.width = canvas.height = Math.round(size * density);
      return { canvas, context: canvas.getContext("2d") };
    });
    return { shape: shapes[figure.dataset.shape], canvases };
  });

  function block(ctx, x, y, width, height, corners, fill) {
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, corners);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function paint({ shape, canvases }, gazeX = 0, gazeY = 0) {
    const theme = document.documentElement.dataset.theme || (darkScheme.matches ? "dark" : "light");
    const colors = palette[theme] ?? palette.light;
    for (const { canvas, context: ctx } of canvases) {
      if (!ctx) continue;
      const scale = canvas.width / 100;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, 100, 100);
      ctx.save();
      if (shape.clip) ctx.clip(shape.clip);
      for (const [x, y, w, h, corners, tone] of shape.tiles) {
        block(ctx, x, y + 1.5, w, h, corners, colors[3]);
        block(ctx, x, y, w, h, corners, colors[tone]);
      }
      const [leftEye, rightEye, y] = shape.eyes;
      for (const x of [leftEye, rightEye]) {
        block(ctx, x - 5.25 + gazeX, y - 6.5 + gazeY, 10.5, 13, 2, colors[4]);
      }
      ctx.restore();
    }
  }

  function paintAll() {
    figures.forEach(figure => paint(figure));
  }

  for (const figure of figures) {
    const canvas = figure.canvases[0].canvas;
    canvas.addEventListener("pointermove", event => {
      if (event.pointerType === "touch" || reducedMotion.matches) return;
      const rect = canvas.getBoundingClientRect();
      const gazeX = event.clientX > rect.left + rect.width * 0.62 ? 2 : event.clientX < rect.left + rect.width * 0.38 ? -2 : 0;
      const gazeY = event.clientY > rect.top + rect.height * 0.62 ? 2 : event.clientY < rect.top + rect.height * 0.38 ? -2 : 0;
      paint(figure, gazeX, gazeY);
    });
    canvas.addEventListener("pointerleave", () => paint(figure));
  }
  darkScheme.addEventListener("change", paintAll);
  reducedMotion.addEventListener("change", paintAll);
  window.addEventListener("openai:set_globals", paintAll);
  paintAll();
})();
</script>
