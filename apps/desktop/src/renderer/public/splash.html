  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Matches the app's default theme background (lib/theme.ts COLORS) so the
       splash → onboarding/main handoff doesn't visibly shift. */
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.44); /* #00000070 */
    }

    .logo {
      width: 40px;
      height: auto;
      color: rgb(135, 133, 128);
    }

    @media (prefers-color-scheme: light) {
      .splash-container {
        background: rgba(255, 255, 255, 0.7); /* #ffffffb3 */
      }
      .logo {
        color: rgb(100, 100, 100);
      }
    }
  </style>
</head>
