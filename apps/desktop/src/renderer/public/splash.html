<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mains</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Matches the app's default theme background (lib/theme.ts COLORS) so the
       splash → onboarding/main handoff doesn't visibly shift. */
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.44); /* #00000070 */
    }

    .logo {
      width: 40px;
      height: auto;
      color: rgb(135, 133, 128);
    }

    @media (prefers-color-scheme: light) {
      .splash-container {
        background: rgba(255, 255, 255, 0.7); /* #ffffffb3 */
      }
      .logo {
        color: rgb(100, 100, 100);
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <svg
    class="logo"
    xmlns="http://www.w3.org/2000/svg"
    width="720"
    height="674"
    viewBox="0 0 720 674"
    fill="none"
  >
    <path
      fill="#fff"
      d="M126.667 57.286C200 177.378 270 230.752 360 230.752s160-53.374 233.333-173.466c13.334-20.015 30-23.35 43.334 0C690 130.676 720 224.08 720 337.5c0 113.42-30 206.824-83.333 280.214-13.334 23.351-30 20.015-43.334 0C520 497.622 450 444.248 360 444.248s-160 53.374-233.333 173.466c-13.334 20.015-30 23.351-43.334 0C30 544.324 0 450.92 0 337.5 0 224.08 30 130.676 83.333 57.286c13.334-23.35 30-20.015 43.334 0Z"
    />
  </svg>
  </div>
</body>
</html>
