<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mains</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Matches the app's default theme background (lib/theme.ts COLORS) so the
       splash → onboarding/main handoff doesn't visibly shift. */
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.44); /* #00000070 */
    }

    .logo {
      width: 40px;
      height: auto;
      color: rgb(135, 133, 128);
    }

    @media (prefers-color-scheme: light) {
      .splash-container {
        background: rgba(255, 255, 255, 0.7); /* #ffffffb3 */
      }
      .logo {
        color: rgb(100, 100, 100);
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <svg
    class="logo"
    xmlns="http://www.w3.org/2000/svg"
    width={720}
    height={666}
    viewBox="0 0 720 666"
    fill="none"
    {...props}
  >
    <path
      fill="#A7A7A7"
      d="M283.5 0h153C594 0 720 122.684 720 276.04v113.921c0 105.157-85.5 205.934-130.5 232.223-22.5 17.527-47.72 8.763-45-26.289L565 331.711c3.74-48.198-29-78.869-63-78.869s-58.1 30.671-63 78.869l-29.5 290.473c-2.67 26.29-18 43.816-45 43.816h-9c-27 0-42.33-17.526-45-43.816L281 331.711c-4.9-48.198-29-78.869-63-78.869s-66.74 30.671-63 78.869l20.5 264.184c2.72 35.052-22.5 43.816-45 26.289C85.5 595.895 0 495.118 0 389.961V276.04C0 122.684 126 0 283.5 0Z"
    />
  </svg>
  </div>
</body>
</html>
