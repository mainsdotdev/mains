name: mains-relay

services:
  relay:
    image: ${RELAY_IMAGE:-mains-relay:local}
    build:
      context: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    secrets:
      - relay_routing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env}
    ports:
      - "${RELAY_BIND_ADDRESS:-0.0.0.0}:${RELAY_HTTP_PORT:-80}:80"
      - "${RELAY_BIND_ADDRESS:-0.0.0.0}:${RELAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  relay_routing:
    file: ${RELAY_SECRET_FILE:-./deploy/secrets/routing.secret}

volumes:
  caddy_data:
  caddy_config:
